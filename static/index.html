<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Voice Companion</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="background-title">The Machine Mind</div>
    <button id="openSettingsBtn" class="settings-btn top-right">Settings</button>
    <div class="agent-container">
        <h1>AI Companion</h1>
        <p>Press the button to speak and get an AI-powered response.</p>
        
        <div id="controls">
            <canvas id="audioVisualizer" width="180" height="180"></canvas>
            
            <button id="recordBtn" class="record-button">
                <svg class="mic-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                    <path d="M19 10v1a7 7 0 0 1-14 0v-1h2v1a5 5 0 0 0 10 0v-1h2z"/>
                </svg>
                <span id="recordBtnText">Record</span>
            </button>
        </div>

        <p id="status" class="status-text">Ready to start</p>
        <audio id="responseAudio" style="display: none;"></audio>

        <div id="transcription-container" style="display: none;">
            <h4>Your question:</h4>
            <div id="transcriptionOutput" class="response-box user-box"></div>
        </div>
        
        <div id="llm-response-container" style="display: none;">
            <h4>AI's response:</h4>
            <div id="llmResponseOutput" class="response-box llm-box"></div>
        </div>
    </div>

    <!-- Settings Sidebar and Overlay -->
    <div id="settingsOverlay" class="settings-overlay" style="display:none;"></div>
    <aside id="settingsSidebar" class="settings-sidebar" aria-hidden="true">
        <div class="settings-header">
            <h2>Settings</h2>
            <button id="closeSettingsBtn" class="settings-close" aria-label="Close settings">×</button>
        </div>
        <div class="settings-content">
            <div class="settings-group">
                <label for="murfKey">MURF_API_KEY</label>
                <input type="password" id="murfKey" placeholder="Enter MURF API Key" autocomplete="off" />
            </div>
            <div class="settings-group">
                <label for="assemblyKey">ASSEMBLYAI_API_KEY</label>
                <input type="password" id="assemblyKey" placeholder="Enter AssemblyAI API Key" autocomplete="off" />
            </div>
            <div class="settings-group">
                <label for="geminiKey">GEMINI_API_KEY</label>
                <input type="password" id="geminiKey" placeholder="Enter Gemini API Key" autocomplete="off" />
            </div>
            <div class="settings-group">
                <label for="opencageKey">OPENCAGE_API_KEY</label>
                <input type="password" id="opencageKey" placeholder="Enter OpenCage API Key" autocomplete="off" />
            </div>

            <div class="settings-subbox">
                <h3>Spotify</h3>
                <div class="settings-group">
                    <label for="spotifyClientId">CLIENT_ID</label>
                    <input type="text" id="spotifyClientId" placeholder="Enter Spotify Client ID" autocomplete="off" />
                </div>
                <div class="settings-group">
                    <label for="spotifyClientSecret">CLIENT_SECRET</label>
                    <input type="password" id="spotifyClientSecret" placeholder="Enter Spotify Client Secret" autocomplete="off" />
                </div>
            </div>

            <div class="settings-actions">
                <button id="saveSettingsBtn" class="btn primary">Save</button>
                <button id="clearSettingsBtn" class="btn secondary">Clear</button>
            </div>
            <div id="settingsSaveStatus" class="settings-save-status" role="status" aria-live="polite"></div>
        </div>
    </aside>

    <script src="/static/script.js"></script>
</body>
</html>
