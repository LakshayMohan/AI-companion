<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Voice Companion</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&display=swap" rel="stylesheet">
    <link rel="icon" href="/favicon.ico">
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="background-title">The Machine Mind</div>
    <button id="switchSessionBtn" class="switch-session top-right">New Session</button>
    <button id="configBtn" class="config-button top-right">⚙️ Config</button>
    <div class="agent-container">
        <div class="agent-header">
            <h1>AI Companion</h1>
        </div>
        <p>Tap to speak, and receive your AI-powered response.</p>
        <div id="controls">
            <canvas id="audioVisualizer" width="180" height="180"></canvas>
            <button id="recordBtn" class="record-button">
                <svg class="mic-icon" viewBox="0 0 24 24">
                    <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                    <path d="M19 10v1a7 7 0 0 1-14 0v-1h2v1a5 5 0 0 0 10 0v-1h2z"/>
                </svg>
                <span id="recordBtnText">Record</span>
            </button>
        </div>
        <div id="websocket-status" class="websocket-status">WebSocket: Disconnected</div>
        <div id="transcription-status" class="transcription-status">Transcription: Inactive</div>
        <button id="stopAudioBtn" class="stop-audio-button" style="display: none;">Stop AI Audio</button>

        <p id="status" class="status-text">Ready to start</p>
        <audio id="responseAudio" controls style="display: none;"></audio>
        <div id="chat-container" class="chat-container">
            <!-- conversation bubbles will be appended here -->
        </div>
    </div>
        <!-- Playlist modal -->
        <div id="playlistModal" class="playlist-modal" style="display:none;">
            <div class="playlist-modal-box">
                <button id="closePlaylistModal" class="close-modal">×</button>
                <h3 id="playlistModalTitle">Playlist</h3>
                <div id="playlistTracks" class="playlist-tracks"></div>
                <div class="player-controls">
                    <button id="playerPrev">⏮</button>
                    <button id="playerPlay">▶</button>
                    <button id="playerNext">⏭</button>
                    <div id="playerProgress" class="player-progress"><div class="player-progress-bar"></div></div>
                </div>
            </div>
        </div>

        <!-- Bottom music bar -->
        <div id="musicBar" class="music-bar" style="display:none;">
            <img id="musicBarImage" src="/static/avatars/smile.png" class="music-bar-image" />
            <div class="music-bar-meta">
                <div id="musicBarTitle" class="music-bar-title">Track title</div>
                <div id="musicBarArtist" class="music-bar-artist">Artist</div>
            </div>
            <div class="music-bar-controls">
                <button id="musicBarPlay">▶</button>
                <div id="musicBarProgress" class="music-bar-progress"><div class="music-bar-progress-fill"></div></div>
            </div>
            </div>
        
            <!-- Config modal -->
            <div id="configModal" class="config-modal" style="display:none;">
                <div class="config-box">
                    <button id="closeConfigModal" class="close-modal">×</button>
                    <h3>API Configuration</h3>
                    <div class="config-section">
                        <h4>General API Keys</h4>
                        <label for="murfKey">MURF_API_KEY</label>
                        <input type="password" id="murfKey" placeholder="Enter MURF API Key">
                        <label for="assemblyKey">ASSEMBLYAI_API_KEY</label>
                        <input type="password" id="assemblyKey" placeholder="Enter AssemblyAI API Key">
                        <label for="geminiKey">GEMINI_API_KEY</label>
                        <input type="password" id="geminiKey" placeholder="Enter Gemini API Key">
                        <label for="opencageKey">OPENCAGE_API_KEY</label>
                        <input type="password" id="opencageKey" placeholder="Enter OpenCage API Key">
                    </div>
                    <div class="config-section">
                        <h4>Spotify</h4>
                        <label for="spotifyClientId">CLIENT_ID</label>
                        <input type="password" id="spotifyClientId" placeholder="Enter Spotify Client ID">
                        <label for="spotifyClientSecret">CLIENT_SECRET</label>
                        <input type="password" id="spotifyClientSecret" placeholder="Enter Spotify Client Secret">
                    </div>
                    <div class="config-actions">
                        <button id="saveConfig" class="test-button">Save</button>
                        <button id="cancelConfig" class="test-button">Cancel</button>
                    </div>
                </div>
            </div>
            <script src="/static/script.js"></script>
    <div id="confirmModal" class="confirm-modal top-right" style="display:none;">
        <div class="confirm-box">
            <p>Start a new session? This will clear current chat history.</p>
            <div class="confirm-actions">
                <button id="confirmYes" class="test-button">Yes</button>
                <button id="confirmNo" class="test-button">No</button>
            </div>
        </div>
    </div>
</body>
</html>
