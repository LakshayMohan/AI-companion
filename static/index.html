<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Voice Companion</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&display=swap" rel="stylesheet">
    <link rel="icon" href="/favicon.ico">
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="background-title">The Machine Mind</div>
    <button id="switchSessionBtn" class="switch-session top-right">New Session</button>
    <!-- Config button to open settings for API keys -->
    <button id="configBtn" class="config-button top-right" title="Settings" aria-controls="configSidebar" aria-expanded="false">
        <span class="visually-hidden">Open Settings</span>
        <span aria-hidden="true">Config ⚙️</span>
    </button>
    <div class="agent-container">
        <div class="agent-header">
            <h1>AI Companion</h1>
        </div>
        <p>Tap to speak, and receive your AI-powered response.</p>
        <div id="controls">
            <canvas id="audioVisualizer" width="180" height="180"></canvas>
            <button id="recordBtn" class="record-button">
                <svg class="mic-icon" viewBox="0 0 24 24">
                    <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                    <path d="M19 10v1a7 7 0 0 1-14 0v-1h2v1a5 5 0 0 0 10 0v-1h2z"/>
                </svg>
                <span id="recordBtnText">Record</span>
            </button>
        </div>
        <div class="status-container">
            <div id="websocket-status" class="websocket-status">WebSocket: Disconnected</div>
            <div id="transcription-status" class="transcription-status">Transcription: Inactive</div>
        </div>
        <button id="stopAudioBtn" class="stop-audio-button" style="display: none;">Stop AI Audio</button>

        <p id="status" class="status-text">Ready to start</p>
        <audio id="responseAudio" controls style="display: none;"></audio>
        <div id="chat-container" class="chat-container">
            <!-- conversation bubbles will be appended here -->
        </div>
    <!-- searchTriggerNote removed: web search now auto-augments relevant factual queries when Tavily key is set -->
    <!-- config sidebar removed from here and will be placed globally so it overlaps the main UI -->
    </div>
        
        <script src="/static/script.js"></script>
        <div id="confirmModal" class="confirm-modal top-right" style="display:none;">
        <div class="confirm-box">
            <p>Start a new session? This will clear current chat history.</p>
            <div class="confirm-actions">
                <button id="confirmYes" class="test-button">Yes</button>
                <button id="confirmNo" class="test-button">No</button>
            </div>
        </div>
    </div>
    <!-- Backdrop for modal (fades background when config is open) -->
    <div id="backdrop" class="backdrop" aria-hidden="true" style="display:none;"></div>

    <!-- Configuration overlay for API keys (global, centered and overlapping main UI) -->
    <aside id="configSidebar" class="config-sidebar" aria-hidden="true">
        <div class="config-inner">
            <h3>Configure API Keys</h3>
            <form id="configForm">
                <label> MURF API Key 
                    <input id="cfg_murf" type="password" placeholder="MURF_API_KEY">
                </label>
                <label> AssemblyAI API Key 
                    <input id="cfg_assemblyai" type="password" placeholder="ASSEMBLYAI_API_KEY">
                </label>
                <label> Gemini API Key 
                    <input id="cfg_gemini" type="password" placeholder="GEMINI_API_KEY">
                </label>
                <div class="hr-with-label">
                    <span class="optional-label">Optional</span>
                </div>
                <label> OpenCage API Key 
                    <input id="cfg_opencage" type="password" placeholder="OPENCAGE_API_KEY">
                </label>
                <label> Tavily API Key 
                    <input id="cfg_tavily" type="password" placeholder="TRAVILY_API_KEY">
                </label>
                <label> Spotify Client ID 
                    <input id="cfg_spotify_id" type="password" placeholder="CLIENT_ID">
                </label>
                <label> Spotify Client Secret 
                    <input id="cfg_spotify_secret" type="password" placeholder="CLIENT_SECRET">
                </label>
                <div class="config-actions">
                    <button id="saveConfig" type="button" class="test-button">Save</button>
                    <button id="closeConfig" type="button" class="test-button">Close</button>
                </div>
            </form>
        </div>
    </aside>
        <!-- Configuration sidebar for API keys (moved inside agent container so it scrolls with the page) -->
        <!-- NOTE: This aside is injected into the DOM inside .agent-container so it moves with page scrolling -->
</body>
</html>
